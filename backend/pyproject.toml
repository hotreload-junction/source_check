[project]
name = "citetrace-backend"
version = "0.1.0"
description = "CiteTrace backend: citation tracing + detection pipeline"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "cryptography>=42",
  "httpx>=0.27",
  "exa-py>=2.28",
  "anthropic>=2.8",
  "rapidfuzz>=3.6",
  "trafilatura>=1.9",
  "lxml_html_clean>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
