name: diagnose-preview

on:
  push:
    branches: [dev]
    paths: [.github/workflows/diagnose-preview.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Diagnose preview claim-extraction failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    environment: preview
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      USER_: ${{ vars.DEPLOY_USER || 'deploy' }}
      ROOT: ${{ vars.DEPLOY_ROOT || '/opt/source-trace' }}
    steps:
      - name: SSH setup
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$HOSTKEY" > ~/.ssh/known_hosts

      - name: Read recent failure details and extraction diagnostics
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$USER_@$HOST" "set -e
              export ENV_NAME=preview
              env_file='$ROOT/preview/.env'
              cd '$ROOT/preview/current'
              docker compose -p source-trace-preview -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml --env-file \"\$env_file\" exec -T backend python -
              echo '--- extraction log details (payloads redacted) ---'
              docker compose -p source-trace-preview -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml --env-file \"\$env_file\" logs --since=24h --no-color backend 2>&1 | grep -E 'one (summary|extraction) reading (failed|unusable)' | sed -E 's/no JSON object in model output:.*/no JSON object in model output: [redacted]/; s/router http ([0-9]{3}):.*/router http \1: [redacted]/' | tail -n 60 || true" <<'PY'
          from sqlalchemy import select
          from app.config import get_settings
          from app.db import session_scope
          from app.models import Analysis

          settings = get_settings()
          print(f"runtime provider={settings.llm_provider_resolved} model={settings.model_extract} verda_key_present={bool(settings.verda_api_key)} base_url={settings.verda_base_url}")
          with session_scope() as session:
              rows = session.scalars(select(Analysis).where(Analysis.status == "failed").order_by(Analysis.created_at.desc()).limit(10)).all()
              print(f"recent failed analyses={len(rows)}")
              for row in rows:
                  print(f"{row.created_at.isoformat()} id={row.id} step={row.step or '-'} error={row.error or '-'}")
          PY

      - name: Compare runtime credential and ping Verda from preview
        env:
          VERDA_API_KEY: ${{ secrets.VERDA_API_KEY }}
        run: |
          printf '%s\n' "$VERDA_API_KEY" | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$USER_@$HOST" "set -e
              export ENV_NAME=preview
              env_file='$ROOT/preview/.env'
              cd '$ROOT/preview/current'
              docker compose -p source-trace-preview -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml --env-file \"\$env_file\" exec -T backend python -c 'import sys, httpx; from app.config import get_settings; s=get_settings(); expected=sys.stdin.readline().strip(); print(\"runtime key matches GitHub secret:\", expected == s.verda_api_key); print(\"runtime Verda base URL:\", s.verda_base_url); r=httpx.post(s.verda_base_url.rstrip(\"/\") + \"/chat/completions\", headers={\"Authorization\": \"Bearer \" + s.verda_api_key}, json={\"model\": s.model_extract, \"messages\": [{\"role\": \"user\", \"content\": \"Reply with JSON: {\\\"ok\\\":true}\"}], \"response_format\": {\"type\": \"json_object\"}, \"max_tokens\": 8, \"temperature\": 0}, timeout=20); print(\"runtime Verda ping status:\", r.status_code)'"

      - name: Retry claim extraction for the latest failed article
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$USER_@$HOST" "set -e
              export ENV_NAME=preview
              env_file='$ROOT/preview/.env'
              cd '$ROOT/preview/current'
              docker compose -p source-trace-preview -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml --env-file \"\$env_file\" exec -T backend python -" <<'PY'
          import logging
          from sqlalchemy import select
          from app import cache
          from app.cache import DbCache, NullCache
          from app.config import get_settings
          from app.db import session_scope
          from app.fetch.fetcher import Fetcher
          from app.llm import LLMClient, LLMError
          from app.models import Analysis
          from app.pipeline.extract import extract_claims
          from app.pipeline.textutil import article_body_filter

          logging.disable(logging.WARNING)
          settings = get_settings()
          store = DbCache()
          cache.set_default(store)
          with session_scope() as session:
              failed = session.scalars(select(Analysis).where(
                  Analysis.status == "failed", Analysis.error.like("%claim extraction failed%")
              ).order_by(Analysis.created_at.desc()).limit(1)).first()
              if failed is None:
                  print("No failed claim-extraction record found")
                  raise SystemExit(2)
              job_id, url = failed.id, failed.url
          print(f"Retrying extraction for failed job {job_id}")
          article = Fetcher.from_settings(settings, cache=store).fetch_article(url)
          if article.status != "ok" or not article.text:
              print(f"Cached article fetch unavailable: {article.status}")
              raise SystemExit(3)
          try:
              result = extract_claims(article.text, url, llm=LLMClient.from_settings(settings, cache=NullCache()),
                                      settings=settings, body_filter=article_body_filter(article.html))
              print(f"Fresh claim extraction succeeded: {len(result.claims)} claims, model={result.model}")
          except LLMError as exc:
              detail = str(exc)
              kind = "HTTP 401" if "401" in detail else "HTTP 429" if "429" in detail else type(exc).__name__
              print(f"Fresh claim extraction failed: {kind}")
              raise SystemExit(4)
          PY
