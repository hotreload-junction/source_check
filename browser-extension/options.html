<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Source Check options</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; color: #0b0b0f; margin: 16px; min-width: 360px; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1.5px solid #e6e6ea; border-radius: 8px; font: inherit; }
      .row { display: flex; gap: 8px; margin-top: 10px; }
      button { padding: 7px 14px; border-radius: 8px; border: 1.5px solid #e6e6ea; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button.primary { background: #0b0b0f; border-color: #0b0b0f; color: #fff; }
      p.hint { color: #6c6c75; font-size: 12.5px; margin: 8px 0 0; }
      #status { margin-top: 12px; font-size: 13px; }
      .ok { color: #2e9d62; } .bad { color: #d23f4b; }
    </style>
  </head>
  <body>
    <label for="base">Source Check server</label>
    <input id="base" type="url" spellcheck="false" autocomplete="off" />
    <p class="hint">Default: <span id="default"></span>. For development: http://localhost:8000. The page you check is sent to this server only when you start a check.</p>
    <div class="row">
      <button id="save" class="primary">Save and test</button>
      <button id="reset">Use default</button>
    </div>
    <div id="status" role="status"></div>
    <script type="module" src="/src/options/main.ts"></script>
  </body>
</html>
