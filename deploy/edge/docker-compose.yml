# Shared edge proxy on the VPS: the only container on 80/443. Routes by hostname to the live and preview stacks.
# One-time: `docker network create edge`, fill deploy/edge/.env (LIVE_HOST, PREVIEW_HOST), `docker compose up -d`.
name: source-trace-edge
services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - edge_data:/data
    networks: [edge]

networks:
  edge:
    external: true
    name: edge

volumes:
  edge_data:
