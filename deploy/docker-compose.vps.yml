# VPS override, layered on deploy/docker-compose.yml:
#   docker compose -p source-trace-<env> -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml up -d --build
# The VPS already runs Traefik (/docker/traefik) on 80/443 with the `letsencrypt` resolver and the docker
# provider (exposedbydefault=false). We publish NO host ports: Traefik finds the web container by its labels,
# terminates TLS and routes by hostname. This also keeps clear of the standalone MariaDB on 127.0.0.1:3306.
# Needs docker compose >= 2.24 (`!reset`). SITE_HOST comes from the env's .env (see docs/deploy.md).
services:
  db:
    ports: !reset []
  web:
    ports: !reset []
    environment:
      SITE_ADDRESS: ":80"   # plain HTTP inside the docker network, TLS is Traefik's job
    labels:   # list form: compose interpolates values, not map keys
      - traefik.enable=true
      - traefik.http.routers.source-trace-${ENV_NAME:?set ENV_NAME=live|preview}.rule=Host(`${SITE_HOST:?set SITE_HOST in .env}`)
      - traefik.http.routers.source-trace-${ENV_NAME}.entrypoints=websecure
      - traefik.http.routers.source-trace-${ENV_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.source-trace-${ENV_NAME}.loadbalancer.server.port=80
