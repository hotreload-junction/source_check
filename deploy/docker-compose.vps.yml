# VPS override, layered on deploy/docker-compose.yml:
#   docker compose -p source-trace-<env> -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml up -d --build
# No host ports at all: the shared edge proxy (deploy/edge) is the only thing on 80/443 and reaches this
# stack's web container over the external docker network `edge` (alias web-<env>). This also keeps the
# stack clear of the standalone MariaDB that already binds 127.0.0.1:3306 on the VPS.
# Needs docker compose >= 2.24 (`!reset`).
services:
  db:
    ports: !reset []
  web:
    ports: !reset []
    environment:
      SITE_ADDRESS: ":80"   # plain HTTP inside the docker network, TLS is terminated by the edge
    networks:
      default: {}
      edge:
        aliases:
          - web-${ENV_NAME:?set ENV_NAME=live|preview}

networks:
  edge:
    external: true
    name: edge
