# Whole stack: MariaDB + backend + web (Caddy serving frontend/dist and proxying /api).
# Same file locally and on the VPS; only .env differs.
#
#   local : cp .env.example .env  (add keys) && docker compose -f deploy/docker-compose.yml --env-file .env up --build
#           -> http://localhost:8080
#   VPS   : set SITE_ADDRESS=<domain>, HTTP_PORT=80, HTTPS_PORT=443 in .env (Caddy gets the certificate itself)
#
# Secrets only in .env (never committed). The backend reads them from there; DATABASE_URL is set below.
name: source-trace

services:
  db:
    image: mariadb:11.8  # 11.7+ ships MariaDB Vector (M2)
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: citetrace
      MARIADB_USER: citetrace
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-citetrace}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"  # loopback only: lets a native backend/pytest reach the container DB
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: mysql+pymysql://citetrace:${MARIADB_PASSWORD:-citetrace}@db:3306/citetrace
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - backend

volumes:
  dbdata:
  caddy_data:
